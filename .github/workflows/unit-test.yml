name: Unit tests

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4.6.0
        with:
          distribution: "jetbrains"
          java-version: 17
          cache: "gradle"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.konan
            /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-kotlin-native-ndk-${{ hashFiles(
            'gradle/libs.versions.toml',
            'gradle.properties'
            ) }}
          restore-keys: |
            ${{ runner.os }}-kotlin-native-ndk-

      - name: Run unit tests
        run: |
          ./gradlew :plugin:test --no-daemon --build-cache --parallel

      # Consumes the umbrella the way a real app does: from a Maven repository, through its POM and
      # Gradle module metadata. A throwaway repository keeps it independent of ~/.m2.
      - name: Build the sample app against the published umbrella
        run: |
          ./gradlew :sample:export:publishAndroidReleaseUmbrellaAarPublicationToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2" --no-daemon --build-cache
          ./gradlew :sample:app:assembleDebug -Dmaven.repo.local="$RUNNER_TEMP/m2" --no-daemon --build-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: test-results
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  functional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ oldest, newest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4.6.0
        with:
          distribution: "jetbrains"
          java-version: 17
          cache: "gradle"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fixtures keep their dependencies in a Gradle user home of their own, which setup-java knows
      # nothing about, and TestKit downloads their distributions to the real one whatever that home.
      - name: Cache fixture downloads
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.gradle/umbrellaaar-test-kit/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-functional-test-${{ matrix.toolchain }}-${{ hashFiles('plugin/src/functionalTest/**/Toolchain.kt') }}
          restore-keys: |
            ${{ runner.os }}-functional-test-${{ matrix.toolchain }}-

      - name: Run functional tests
        run: |
          ./gradlew :plugin:functionalTest -Pumbrellaaar.toolchain=${{ matrix.toolchain }} --no-daemon --build-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: functional-test-results-${{ matrix.toolchain }}
          path: |
            plugin/build/reports/tests/functionalTest/**
            plugin/build/test-results/functionalTest/**
